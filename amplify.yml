version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        # Next.js SSR does not expose Amplify build variables to server routes by default.
        # Persist only the required configuration and the Secrets Manager ARN pointer.
        - env | grep -E '^(NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_POSTHOG_KEY|NEXT_PUBLIC_POSTHOG_HOST|NEXT_PUBLIC_POSTHOG_PROJECT_URL|NEXT_PUBLIC_TURNSTILE_SITE_KEY|AGENTPROOF_ENVIRONMENT|AGENTPROOF_DAILY_RUN_LIMIT_PER_AGENT|AGENTPROOF_FOUNDER_USER_IDS|AGENTPROOF_TURNSTILE_SECRET_KEY|AGENTPROOF_DYNAMODB_TABLE|AGENTPROOF_REPORTS_BUCKET|AGENTPROOF_VERIFICATION_QUEUE_URL|COGNITO_USER_POOL_ID|COGNITO_CLIENT_ID|NEXT_PUBLIC_COGNITO_USER_POOL_ID|NEXT_PUBLIC_COGNITO_CLIENT_ID|OPENAI_SECRET_ARN|OPENAI_MODEL|DODO_PAYMENTS_API_KEY|DODO_PAYMENTS_WEBHOOK_KEY|DODO_PAYMENTS_ENVIRONMENT|DODO_CHECKOUT_ENABLED|DODO_BUILDER_PRODUCT_ID|DODO_AGENCY_PRODUCT_ID|DODO_ONE_RUN_PRODUCT_ID)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
